services:
  migrate:
    profiles: [ops]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      AUTH_MODE: local
      ASSET_STORE: s3
    command: ["npm", "run", "db:migrate", "-w", "@builder/api"]
    restart: "no"
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      AUTH_MODE: local
      ASSET_STORE: s3
      API_HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
